name: JobRadar Automatic Job Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: jobradar-updates
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect job vacancies
        run: python fetch_jobs.py

      - name: Save updated job database
        run: |
          if [[ -n "$(git status --porcelain jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs.json
            git commit -m "Update job listings"
            git push
          else
            echo "No changes to job listings."
          fi
